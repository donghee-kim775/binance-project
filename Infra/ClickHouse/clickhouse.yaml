# ClickHouse 단일 노드. 설치 · 접속 방법과 설정 이유는 README.md
#
# 비밀번호는 이 파일에 두지 않는다. 먼저 Secret을 만든다:
#   kubectl create secret generic clickhouse-auth -n binance-storage --from-literal=password='<비밀번호>'
apiVersion: v1
kind: Namespace
metadata:
  name: binance-storage
---
# 메모리를 덜 쓰게 줄인 설정. 이미지 기본 config.xml 위에 덮어쓴다 (/etc/clickhouse-server/config.d/)
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: binance-storage
data:
  low-memory.xml: |
    <clickhouse>
        <!-- 기본 5GB. pod 메모리 limit(2Gi)에 맞춰 256MB로 줄인다 -->
        <mark_cache_size>268435456</mark_cache_size>
        <!-- 계속 쌓이기만 하는 시스템 로그 테이블을 끈다. query_log, part_log는 쿼리 분석에 쓰려고 남긴다 -->
        <trace_log remove="1"/>
        <text_log remove="1"/>
        <metric_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <query_thread_log remove="1"/>
        <processors_profile_log remove="1"/>
    </clickhouse>
---
# 클러스터 안에서 접속하는 주소: clickhouse.binance-storage.svc (HTTP 8123, native 9000)
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: binance-storage
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: binance-storage
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8   # LTS
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            # 이미지 entrypoint가 처음 뜰 때 DB와 사용자를 만든다
            - name: CLICKHOUSE_DB
              value: binance
            - name: CLICKHOUSE_USER
              value: admin
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
            # admin이 SQL로 사용자 · 권한을 만들 수 있게 한다 (리포트용 읽기 전용 사용자 등)
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/low-memory.xml
              subPath: low-memory.xml
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  # pod가 다시 떠도 데이터가 남게 PVC에 둔다. storageClassName을 비워 클러스터 기본 StorageClass를 쓴다
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
