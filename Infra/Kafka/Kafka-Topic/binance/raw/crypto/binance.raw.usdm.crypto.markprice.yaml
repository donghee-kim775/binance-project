# USD-M 무기한 선물 마크 가격 (BTCUSDT) — markprice-usdm-sov pod가 쓴다 (docs/kafka/topics.md)
# fixed-rate(Active-Standby)라 중복이 없어 clean 토픽 없이 Flink가 바로 읽는다
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: binance.raw.usdm.crypto.markprice   # 토픽 이름과 같게 (소문자 · 숫자 · . 만 쓰는 이름 규칙)
  namespace: kafka
  labels:
    strimzi.io/cluster: binance-cluster     # 이 토픽을 관리할 Kafka 클러스터
spec:
  partitions: 3     # 키 = 심볼. 지금은 BTCUSDT 하나라 1개 파티션에만 쌓이지만 심볼 추가 대비
  replicas: 3       # 브로커 3대에 하나씩
  config:
    min.insync.replicas: 2       # 브로커 1대 장애까지 쓰기 유지 (producer acks=all과 짝)
    retention.ms: 259200000      # 3일
    cleanup.policy: delete       # 시계열 이벤트 — compaction 대상 아님
    compression.type: zstd       # envelope JSON 압축 (producer compression-type과 같게)
