# binance.raw.spot.crypto.bookticker의 dedup 결과 — Flink dedup job이 쓴다 (docs/kafka/topics.md)
# raw는 spot-sov pod 2개(Active-Active)가 같은 이벤트를 각자 보내 중복이 있다. dedup 키는 (symbol, u) — order book update id
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: binance.clean.spot.crypto.bookticker   # 토픽 이름과 같게 (소문자 · 숫자 · . 만 쓰는 이름 규칙)
  namespace: binancekafka
  labels:
    strimzi.io/cluster: binance-cluster     # 이 토픽을 관리할 Kafka 클러스터
spec:
  partitions: 3     # 키 = 심볼. raw와 같은 수 (co-partitioning)
  replicas: 3       # 브로커 3대에 하나씩
  config:
    min.insync.replicas: 2       # 브로커 1대 장애까지 쓰기 유지 (producer acks=all과 짝)
    retention.ms: 86400000       # 24h (Insight 1 기준)
    cleanup.policy: delete       # 시계열 이벤트 — compaction 대상 아님
    compression.type: zstd       # envelope JSON 압축 (raw와 같게)
