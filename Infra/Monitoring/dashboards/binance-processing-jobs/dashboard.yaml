            "x": 15,
            "y": 1,
            "w": 5,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(avg_over_time(sum(clamp_min(kafka_consumergroup_lag{consumergroup=~\"kstreams-dedup|kstreams-basis-kdedup\"}, 0))[2m:15s]), \"pipeline\", \"Kafka Streams\", \"\", \"\") or label_replace(avg_over_time(sum(clamp_min(kafka_consumergroup_lag{consumergroup=~\"flink-dedup|flink-basis\"}, 0))[2m:15s]), \"pipeline\", \"Flink 셔플\", \"\", \"\") or label_replace(avg_over_time(sum(clamp_min(kafka_consumergroup_lag{consumergroup=~\"flink-dedup-copart|flink-basis-copart\"}, 0))[2m:15s]), \"pipeline\", \"Flink co-partition\", \"\", \"\")",
              "legendFormat": "{{pipeline}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "-",
              "color": {
