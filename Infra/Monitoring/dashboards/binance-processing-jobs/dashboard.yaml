            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "text": {
              "titleSize": 11,
              "valueSize": 18
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "출력 /s",
          "description": "job이 쓰는 토픽의 끝 offset 증가율. Kafka Streams 출력은 트랜잭션 마커만큼 크게 보인다 (basis 6/s → 약 8/s)",
