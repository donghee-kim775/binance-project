                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#e76624"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "kstreams-basis"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#00a888"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "flink-basis-kdedup"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d28e05"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "kstreams-basis-kdedup"
                },
                "properties": [
                  {
                    "id": "color",
