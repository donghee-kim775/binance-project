# Grafana 대시보드: 처리 job 비교 — 위쪽 필터로 단계(dedup / basis)와 job을 골라 같은 패널에 나란히 본다
# - 라벨 grafana_dashboard: "1" 이면 Grafana sidecar가 자동으로 불러온다 (Infra/Monitoring/README.md)
# - 지표 출처: Kafka Exporter (offset, lag) + cAdvisor (pod CPU · 메모리 · 네트워크) + kube-state-metrics (Ready)
# - job 이름 = consumer group = Deployment · FlinkDeployment 이름이라는 규칙에 기댄다 (같은 폴더 README.md)
# - 생성 스크립트로 만들었다. 패널을 고칠 때는 JSON을 직접 고쳐도 된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-binance-processing-jobs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  binance-processing-jobs.json: |
    {
      "uid": "binance-processing-jobs",
      "title": "Binance / 처리 job 비교 (단계 · job 필터)",
      "tags": [
        "binance"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "데이터 소스",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "stage",
            "label": "단계",
            "type": "custom",
            "query": "dedup (raw → clean) : (flink|kstreams)-dedup,basis (clean → analytics) : (flink|kstreams)-basis.*",
            "current": {
              "text": "dedup (raw → clean)",
              "value": "(flink|kstreams)-dedup"
            },
            "options": [
              {
                "text": "dedup (raw → clean)",
                "value": "(flink|kstreams)-dedup",
                "selected": true
              },
              {
                "text": "basis (clean → analytics)",
                "value": "(flink|kstreams)-basis.*",
                "selected": false
              }
            ],
            "multi": false,
            "includeAll": false
          },
          {
            "name": "job",
            "label": "job",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kafka_consumergroup_lag{consumergroup=~\"$stage\"}, consumergroup)",
              "refId": "job"
            },
            "definition": "label_values(kafka_consumergroup_lag{consumergroup=~\"$stage\"}, consumergroup)",
            "multi": true,
            "includeAll": true,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 901,
          "type": "row",
          "title": "지금 (선택한 job)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "입력 처리 /s",
          "description": "job(consumer group)이 초당 처리하고 커밋한 레코드 수. basis job은 Spot clean + mark 합",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumergroup) (rate(kafka_consumergroup_current_offset{consumergroup=~\"(${job:pipe})\"}[1m]))",
              "legendFormat": "{{consumergroup}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "decimals": 0,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#9c9c9c"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "flink-dedup"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#e76624"
                    }
                  }
                ]
              },
              {
                "matcher": {
