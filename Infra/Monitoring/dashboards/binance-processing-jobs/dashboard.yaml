# Grafana 대시보드: 처리 파이프라인 비교 — 같은 raw를 읽는 세 파이프라인(dedup → basis)을 나란히 본다
#   Kafka Streams      : kstreams-dedup     → kstreams-basis-kdedup
#   Flink 셔플         : flink-dedup        → flink-basis          (keyBy)
#   Flink co-partition : flink-dedup-copart → flink-basis-copart   (reinterpretAsKeyedStream)
# - 라벨 grafana_dashboard: "1" 이면 Grafana sidecar가 자동으로 불러온다 (Infra/Monitoring/README.md)
# - 지표 출처: Kafka Exporter (offset, lag) + cAdvisor (pod CPU · 메모리 · 네트워크) + kube-state-metrics (Ready)
# - 파이프라인 구성은 생성 스크립트의 PIPELINES에 있다. 패널을 고칠 때는 JSON을 직접 고쳐도 된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-binance-processing-jobs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  binance-processing-jobs.json: |
    {
      "uid": "binance-processing-jobs",
      "title": "Binance / 처리 파이프라인 비교 (dedup → basis)",
      "tags": [
        "binance"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "데이터 소스",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 901,
          "type": "row",
          "title": "① 파이프라인 합계 (dedup + basis)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU",
          "description": "dedup + basis pod CPU 합 (core, 2분 평균)",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 5,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"kstreams-dedup-[a-z0-9]+-[a-z0-9]{5}|kstreams-basis-kdedup-[a-z0-9]+-[a-z0-9]{5}\", container!=\"\"}[2m])), \"pipeline\", \"Kafka Streams\", \"\", \"\") or label_replace(sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"flink-dedup-(taskmanager-[0-9]+-[0-9]+|[a-z0-9]+-[a-z0-9]{5})|flink-basis-(taskmanager-[0-9]+-[0-9]+|[a-z0-9]+-[a-z0-9]{5})\", container!=\"\"}[2m])), \"pipeline\", \"Flink 셔플\", \"\", \"\") or label_replace(sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"flink-dedup-copart-(taskmanager-[0-9]+-[0-9]+|[a-z0-9]+-[a-z0-9]{5})|flink-basis-copart-(taskmanager-[0-9]+-[0-9]+|[a-z0-9]+-[a-z0-9]{5})\", container!=\"\"}[2m])), \"pipeline\", \"Flink co-partition\", \"\", \"\")",
              "legendFormat": "{{pipeline}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: core",
              "decimals": 3,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#9c9c9c"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Kafka Streams"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3274D9"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Flink 셔플"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#E0752D"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Flink co-partition"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#B62AD9"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "text": {
              "titleSize": 11,
              "valueSize": 18
            }
          }
        },
