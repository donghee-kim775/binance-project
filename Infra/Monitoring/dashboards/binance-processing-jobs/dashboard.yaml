          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(label_replace(sum(rate(kafka_topic_partition_current_offset{topic=\"binance.clean.spot.crypto.bookticker\"}[1m])), \"app\", \"flink-dedup\", \"\", \"\") or label_replace(sum(rate(kafka_topic_partition_current_offset{topic=\"binance.clean.spot.crypto.bookticker.kstreams\"}[1m])), \"app\", \"kstreams-dedup\", \"\", \"\") or label_replace(sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis\"}[1m])), \"app\", \"flink-basis\", \"\", \"\") or label_replace(sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis.kstreams\"}[1m])), \"app\", \"kstreams-basis\", \"\", \"\") or label_replace(sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis.kdedup.flink\"}[1m])), \"app\", \"flink-basis-kdedup\", \"\", \"\") or label_replace(sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis.kdedup.kstreams\"}[1m])), \"app\", \"kstreams-basis-kdedup\", \"\", \"\")) and on(app) label_replace(group by (consumergroup) (kafka_consumergroup_lag{consumergroup=~\"(${job:pipe})\"}), \"app\", \"$1\", \"consumergroup\", \"(.*)\")",
              "legendFormat": "{{app}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "decimals": 1,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#9c9c9c"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "flink-dedup"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#e76624"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "kstreams-dedup"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#338ced"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "flink-basis"
                },
                "properties": [
