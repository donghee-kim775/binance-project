# Grafana 대시보드: basis join — Flink keyBy(flink-basis) · Flink co-partition(flink-basis-copart) · Kafka Streams(kstreams-basis-kdedup) 비교
# - 라벨 grafana_dashboard: "1" 이면 Grafana sidecar가 자동으로 불러온다 (Infra/Monitoring/README.md)
# - 지표 출처: Kafka Exporter (출력 offset, consumer lag) + cAdvisor (pod CPU · 메모리 · 네트워크). 앱 reporter 없이 본다
# - 각 경로는 해당 overlay로 띄웠을 때만 값이 있다 (kstreams-join/compare · compare-kdedup, flink-join/compare-copart)
# - 지연(basis_time − receive_time)은 메시지 안의 값이라 Prometheus로 볼 수 없다. 같은 폴더 README.md의 측정 명령을 쓴다
# - 패널별 계산 방법: 같은 폴더의 README.md
# - 이 파일은 생성 스크립트로 만들었다. 패널을 고칠 때는 JSON을 직접 고쳐도 된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-binance-basis-join
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  binance-basis-join.json: |
    {
      "uid": "binance-basis-join",
      "title": "Binance / basis join: Flink(keyBy · co-partition) vs Kafka Streams",
      "tags": [
        "binance"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "데이터 소스",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Flink keyBy · flink-basis",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "출력 · Flink keyBy",
          "description": "binance.analytics.crypto.basis. 출력 토픽의 끝 offset 증가율(1분). markPrice가 심볼마다 초당 1건이라 6심볼이면 약 6/s. Kafka Streams는 exactly-once 트랜잭션 마커만큼 크게 보인다",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis\"}[1m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "decimals": 2,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#E0752D"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#E0752D",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Lag (2분 평균) · Flink keyBy",
          "description": "group flink-basis. consumer group lag 합 (Spot + mark). Flink는 체크포인트(10s)마다 커밋해 톱니, Kafka Streams는 100ms(EOS)",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time(sum(clamp_min(kafka_consumergroup_lag{consumergroup=\"flink-basis\"}, 0))[2m:15s])"
