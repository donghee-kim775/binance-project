# Grafana 대시보드: basis join — Flink(flink-basis) vs Kafka Streams(kstreams-basis) 비교
# - 라벨 grafana_dashboard: "1" 이면 Grafana sidecar가 자동으로 불러온다 (Infra/Monitoring/README.md)
# - 지표 출처: Kafka Exporter (출력 offset, consumer lag) + cAdvisor (pod CPU · 메모리 · 네트워크). 앱 reporter 없이 본다
# - Kafka Streams 쪽은 compare overlay(consumer/clean_analytics/kstreams-join/compare)로 띄웠을 때만 값이 있다 (출력 토픽 .kstreams)
# - 지연(basis_time − receive_time)은 메시지 안의 값이라 Prometheus로 볼 수 없다. 같은 폴더 README.md의 측정 명령을 쓴다
# - 패널별 계산 방법: 같은 폴더의 README.md
# - 이 파일은 생성 스크립트로 만들었다. 패널을 고칠 때는 JSON을 직접 고쳐도 된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-binance-basis-join
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  binance-basis-join.json: |
    {
      "uid": "binance-basis-join",
      "title": "Binance / basis join: Flink vs Kafka Streams",
      "tags": [
        "binance"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "데이터 소스",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "현상황 (Flink vs Kafka Streams)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "출력 · Flink",
          "description": "binance.analytics.crypto.basis에 초당 쓰는 basis 수. 끝 offset 증가율(1분). markPrice가 심볼마다 초당 1건이라 BTC 하나면 약 1/s",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis\"}[1m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "decimals": 2,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#E0752D"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#E0752D",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "출력 · Kafka Streams (offset)",
          "description": "binance.analytics.crypto.basis.kstreams의 끝 offset 증가율(1분). exactly-once라 커밋마다 트랜잭션 마커가 offset을 하나 차지한다. basis 1건마다 커밋하면 실제(약 1/s)의 2배로 보인다. compare overlay로 띄웠을 때만 값이 있다",
          "gridPos": {
            "x": 3,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis.kstreams\"}[1m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "decimals": 2,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#3274D9"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3274D9",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Lag · Flink",
          "description": "consumer group flink-basis의 lag 합 (Spot + mark). offset은 체크포인트(10s)마다 커밋돼 톱니로 보인다",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(clamp_min(kafka_consumergroup_lag{consumergroup=\"flink-basis\"}, 0))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#E0752D"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#E0752D",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Lag · Kafka Streams",
          "description": "consumer group kstreams-basis의 lag 합 (Spot + mark). 커밋 간격 100ms(EOS)",
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(clamp_min(kafka_consumergroup_lag{consumergroup=\"kstreams-basis\"}, 0))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#3274D9"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3274D9",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "CPU · Flink",
          "description": "pod flink-basis-(taskmanager-.*|[a-z0-9]+-[a-z0-9]{5}) (JobManager + TaskManager) CPU 합. core 단위, 5분 평균",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"flink-basis-(taskmanager-.*|[a-z0-9]+-[a-z0-9]{5})\", container!=\"\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: core",
              "decimals": 3,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#E0752D"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#E0752D",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "CPU · Kafka Streams",
          "description": "pod kstreams-basis-[a-z0-9]+-[a-z0-9]{5} CPU 합. core 단위, 5분 평균",
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"kstreams-basis-[a-z0-9]+-[a-z0-9]{5}\", container!=\"\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: core",
              "decimals": 3,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#3274D9"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3274D9",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "메모리 · Flink",
          "description": "pod flink-basis-(taskmanager-.*|[a-z0-9]+-[a-z0-9]{5}) working set 합 (JVM heap을 미리 잡아 두므로 실제 state보다 크다)",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"binance-processing\", pod=~\"flink-basis-(taskmanager-.*|[a-z0-9]+-[a-z0-9]{5})\", container!=\"\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#E0752D"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#E0752D",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "메모리 · Kafka Streams",
          "description": "pod kstreams-basis-[a-z0-9]+-[a-z0-9]{5} working set 합",
          "gridPos": {
            "x": 21,
            "y": 1,
            "w": 3,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"binance-processing\", pod=~\"kstreams-basis-[a-z0-9]+-[a-z0-9]{5}\", container!=\"\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "noValue": "-",
              "color": {
                "mode": "fixed",
                "fixedColor": "#3274D9"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3274D9",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "text": {
              "titleSize": 13,
              "valueSize": 28
            }
          }
        },
        {
          "id": 109,
          "type": "row",
          "title": "출력과 입력 (records/sec)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "basis 출력 속도 (offset 증가율)",
          "description": "끝 offset 증가율이다. Kafka Streams(exactly-once)는 커밋마다 트랜잭션 마커가 offset을 하나 차지해 실제 메시지 수보다 크게 보인다 (basis 1건마다 커밋하면 2배). 실제 건수 비교는 README의 측정 명령으로 한다",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis\"}[1m]))",
              "legendFormat": "Flink"
            },
            {
              "refId": "B",
              "expr": "sum(rate(kafka_topic_partition_current_offset{topic=\"binance.analytics.crypto.basis.kstreams\"}[1m]))",
              "legendFormat": "Kafka Streams"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "noValue": "-",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "decimals": 2
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Flink"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#E0752D"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Kafka Streams"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3274D9"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "입력 속도",
          "description": "join 입력 두 토픽의 유입. Spot(clean bookTicker)은 초당 수백 건, mark(raw markPrice)는 심볼마다 초당 1건",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (topic) (rate(kafka_topic_partition_current_offset{topic=~\"binance.clean.spot.crypto.bookticker|binance.raw.usdm.crypto.markprice\"}[1m]))",
              "legendFormat": "{{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "noValue": "-",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 112,
          "type": "row",
          "title": "consumer lag · 처리 속도",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "consumer lag (그룹 · 토픽별)",
          "description": "계속 오르면 그 버전이 입력을 못 따라가는 것. Flink는 10초 톱니, Kafka Streams는 거의 평평한 게 정상",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumergroup, topic) (clamp_min(kafka_consumergroup_lag{consumergroup=~\"flink-basis|kstreams-basis\"}, 0))",
              "legendFormat": "{{consumergroup}} · {{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "-",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "처리 속도 (커밋된 offset 증가율)",
          "description": "그룹이 초당 처리를 끝내고 커밋한 레코드 수. 입력 속도와 같은 높이면 따라가고 있다",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (consumergroup, topic) (rate(kafka_consumergroup_current_offset{consumergroup=~\"flink-basis|kstreams-basis\"}[1m]))",
              "legendFormat": "{{consumergroup}} · {{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: /s",
              "noValue": "-",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 115,
          "type": "row",
          "title": "자원 (pod 합)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "CPU",
          "description": "버전별 pod CPU 합 (5분 평균)",
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"flink-basis-(taskmanager-.*|[a-z0-9]+-[a-z0-9]{5})\", container!=\"\"}[5m]))",
              "legendFormat": "Flink"
            },
            {
              "refId": "B",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"binance-processing\", pod=~\"kstreams-basis-[a-z0-9]+-[a-z0-9]{5}\", container!=\"\"}[5m]))",
              "legendFormat": "Kafka Streams"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: core",
              "noValue": "-",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "decimals": 3
