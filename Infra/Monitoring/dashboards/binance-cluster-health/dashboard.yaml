# Grafana 대시보드: 노드 사용률, 수집기 · 처리기 · Kafka · 저장소 pod 운영 상태 (metrics.md 1 · 2 · 3-3 · 4 · 5절)
# - 라벨 grafana_dashboard: "1" 이면 Grafana sidecar가 자동으로 불러온다 (Infra/Monitoring/README.md)
# - 지표 출처: kube-prometheus-stack 기본 수집 — node-exporter(노드), cAdvisor(pod CPU · 메모리 · 네트워크), kube-state-metrics(pod 상태)
#   → 앱 쪽 설정이 필요 없다
# - node-exporter의 instance는 IP라 node_uname_info와 join해 노드 이름(nodename)을 붙인다
# - 패널별 계산 방법: 같은 폴더의 README.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-binance-cluster-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  binance-cluster-health.json: |
    {
      "uid": "binance-cluster-health",
      "title": "Binance / 노드 · pod 운영 상태",
      "tags": [
        "binance"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "데이터 소스",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "현상황",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "노드 Ready",
          "description": "Ready 상태인 노드 수. 4대 중 하나라도 빠지면 그 노드의 Kafka broker · MinIO가 같이 빠진다.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
              "legendFormat": "Ready",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "-",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "수집기 Ready / 목표",
          "description": "binance-ingestion의 Ready pod 수와 Deployment replicas 합. 두 값이 다르면 Active-Active가 깨졌거나 Active-Standby가 비었다. 배포가 없으면 `-`.",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"binance-ingestion\", condition=\"true\"})",
              "legendFormat": "Ready",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_spec_replicas{namespace=\"binance-ingestion\"})",
              "legendFormat": "목표",
              "refId": "B"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "-",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "처리기 Ready / 전체",
          "description": "binance-processing(Flink JobManager · TaskManager) pod 중 Ready 수와 전체 수. job 하나에 JobManager 1 + TaskManager 3.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"binance-processing\", condition=\"true\"})",
              "legendFormat": "Ready",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(kube_pod_info{namespace=\"binance-processing\"})",
              "legendFormat": "전체",
              "refId": "B"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "-",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Kafka broker Ready",
          "description": "binancekafka의 broker pod(binance-cluster-binance-cluster-pool-N) 중 Ready 수. 3대 중 2대면 min.insync.replicas=2라 쓰기는 되지만 한 대 더 빠지면 멈춘다.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"binancekafka\", pod=~\"binance-cluster-binance-cluster-pool-.*\", condition=\"true\"})",
              "legendFormat": "Ready",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "-",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "MinIO Ready",
          "description": "MinIO pod 4개 중 Ready 수. 3이면 계속 동작, 2 이하면 쓰기가 멈춰 Flink 체크포인트가 실패한다.",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"binance-storage\", pod=~\"minio-.*\", condition=\"true\"})",
              "legendFormat": "Ready",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "-",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "pod 재시작 (1시간)",
          "description": "binance-* namespace 전체 컨테이너 재시작 횟수의 최근 1시간 증가량. 누가 재시작했는지는 아래 표의 '재시작' 열.",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"binance.*\"}[1h]))",
              "legendFormat": "재시작",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "-",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "노드 (dclabnode1~4)",
          "id": 8,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU 사용률",
          "description": "1 − idle 비율 (5분 평균). 노드마다 core 수가 달라(8~16) 같은 % 라도 여유 core 수는 다르다.",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "-",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "메모리 사용률",
          "description": "1 − MemAvailable / MemTotal. page cache는 회수 가능해 사용으로 치지 않는다.",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "-",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "디스크 사용률 (/)",
          "description": "루트 파일시스템. local-path PVC(Kafka 로그, MinIO, ClickHouse)가 이 디스크 위에 있다. local-path는 PVC별 사용량 지표를 내지 않아 노드 디스크로 본다.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(1 - node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"rootfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"rootfs\"}) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "-",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "메모리 요청 / 할당 가능",
          "description": "노드에 올라간 pod의 memory request 합 ÷ 노드 allocatable. 100%에 가까우면 새 pod(예: Flink job 추가)가 Pending이 된다. 실제 사용량이 아니라 스케줄러가 보는 값이다.",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) / on(node) group_left kube_node_status_allocatable{resource=\"memory\"}",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "-",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "네트워크 수신",
          "description": "물리 NIC(en*, eth*) 기준 초당 수신 바이트. Kafka 복제 트래픽이 노드 사이에 오간다.",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total{device=~\"en.*|eth.*\"}[5m])) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "noValue": "-",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "네트워크 송신",
          "description": "물리 NIC(en*, eth*) 기준 초당 송신 바이트.",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total{device=~\"en.*|eth.*\"}[5m])) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "noValue": "-",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "수집기 (binance-ingestion)",
          "id": 15,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "table",
