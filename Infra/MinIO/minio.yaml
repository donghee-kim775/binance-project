# MinIO 분산 모드 (pod 4개 × 드라이브 1개, erasure coding). Flink 체크포인트 · savepoint 저장소 (S3 호환). 설치 방법과 설정 이유는 README.md
#
# 계정은 이 파일에 두지 않는다. 먼저 Secret을 만든다:
#   kubectl create secret generic minio-auth -n binance-storage \
#     --from-literal=root-user='<아이디>' --from-literal=root-password='<비밀번호 8자 이상>'
apiVersion: v1
kind: Namespace
metadata:
  name: binance-storage
---
# 클러스터 안에서 접속하는 주소: minio.binance-storage.svc (S3 API 9000, 웹 콘솔 9001)
# 클러스터 밖(PC)에서는 <노드 IP>:30901 (웹 콘솔), <노드 IP>:30902 (S3 API, mc 등)
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: binance-storage
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30902
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
# pod끼리 서로를 찾는 주소: minio-<N>.minio-headless.binance-storage.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: binance-storage
spec:
  clusterIP: None
  # 처음 뜰 때는 4개가 서로 붙어야 ready가 된다. ready 전에도 DNS가 잡혀야 서로를 찾을 수 있다
  publishNotReadyAddresses: true
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: binance-storage
spec:
  serviceName: minio-headless
  replicas: 4
  # OrderedReady면 minio-0이 ready가 될 때까지 minio-1을 띄우지 않는데, minio-0은 과반이 모여야 ready가 된다. 동시에 띄운다
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # 노드 하나가 죽어도 드라이브는 하나만 잃게 노드마다 pod 하나씩 둔다
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: minio
              topologyKey: kubernetes.io/hostname
      containers:
        - name: minio
          # 공식 minio/minio 이미지는 지워졌다. 커뮤니티 fork SILO 이미지를 태그로 고정한다 (README.md)
          # entrypoint가 `server` 인자를 `silo server`로 바꿔 실행한다
          image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
          # {0...3}은 MinIO가 펼치는 범위 표기다. 4개 드라이브가 erasure set 하나가 된다 (기본 패리티 EC:2)
          args:
            - server
            - http://minio-{0...3}.minio-headless.binance-storage.svc.cluster.local/data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-auth
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-auth
                  key: root-password
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  # pod마다 PVC가 하나씩 생긴다 (data-minio-0 ~ 3). storageClassName을 비워 클러스터 기본 StorageClass를 쓴다
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# Flink가 쓸 버킷을 만든다. MinIO가 뜰 때까지 기다렸다가 한 번 실행하고 끝난다 (이미 있으면 넘어간다)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: binance-storage
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z   # mc(mcli)가 들어 있다
          command: [/bin/sh, -c]
          args:
            - |
              until mc alias set local http://minio.binance-storage.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "MinIO 대기 중"; sleep 3
              done
              mc mb --ignore-existing local/flink
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-auth
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-auth
                  key: root-password
