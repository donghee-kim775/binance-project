# spot-btcusdt — variable-rate · Active-Active (replicas 2)
# 구독: BTC × bookTicker · trade · depth@100ms  (소켓 3개)
apiVersion: v1
kind: ConfigMap
metadata:
  name: spot-btcusdt-config
  namespace: binance-ingestion
  labels:
    app.kubernetes.io/name: ingestion-collector
    app.kubernetes.io/instance: spot-btcusdt
    rate-group: variable
data:
  # /config/application.yaml로 마운트되어 이미지 안의 application.yml을 덮어쓴다
  application.yaml: |
    binance:
      setup:
        symbol: BTCUSDT   # 현재 POC가 읽는 유일한 값 (아래 ingestion.* 은 runner 리팩터링 후 사용)
    ingestion:
      group: variable-rate
      product: spot
      asset-class: crypto
      sector: null
      symbols: [BTCUSDT]
      streams:
        - stream: bookTicker
          path: ""
          topic: binance.raw.spot.crypto.bookticker
        - stream: trade
          path: ""
          topic: binance.raw.spot.crypto.trade
        - stream: depth@100ms
          path: ""
          topic: binance.raw.spot.crypto.depth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-btcusdt
  namespace: binance-ingestion
  labels:
    app.kubernetes.io/name: ingestion-collector
    app.kubernetes.io/instance: spot-btcusdt
    rate-group: variable
spec:
  replicas: 2   # Active-Active: 두 pod가 같은 스트림을 동시에 수신 (중복은 dedup에서 제거)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # 배포 중에도 2개가 계속 수신 → 수집 공백 없음
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: spot-btcusdt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-collector
        app.kubernetes.io/instance: spot-btcusdt
        rate-group: variable
        product: spot
        asset-class: crypto
    spec:
      # 두 replica를 서로 다른 노드에 배치 → 노드 1대가 죽어도 하나는 수신을 이어감
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: spot-btcusdt
      terminationGracePeriodSeconds: 30   # @PreDestroy에서 WebSocket close 프레임을 보낼 시간
      securityContext:
        runAsNonRoot: true
      containers:
        - name: collector
          image: ingestion-collector:0.0.1
          imagePullPolicy: IfNotPresent   # kind load로 넣은 로컬 이미지를 사용
          envFrom:
            - configMapRef:
                name: ingestion-common
          env:
            - name: COLLECTOR_ID           # envelope의 collector_id (어느 pod가 보낸 메시지인지)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spot-btcusdt-config
---
# 노드 drain 등 자발적 중단 시에도 최소 1개는 남겨 둔다
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spot-btcusdt
  namespace: binance-ingestion
  labels:
    app.kubernetes.io/name: ingestion-collector
    app.kubernetes.io/instance: spot-btcusdt
    rate-group: variable
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: spot-btcusdt
