# usdm-semi — variable-rate · Active-Active (replicas 2)
# 구독: NVDA, AVGO, MRVL × bookTicker · aggTrade · depth@100ms  (소켓 3개)
apiVersion: v1
kind: ConfigMap
metadata:
  name: usdm-semi-config
  namespace: binance-ingestion
  labels:
    app.kubernetes.io/name: ingestion-collector
    app.kubernetes.io/instance: usdm-semi
    rate-group: variable
data:
  # /config/application.yaml로 마운트되어 이미지 안의 application.yml을 덮어쓴다
  application.yaml: |
    binance:
      subscription:
        group: variable-rate
        product: usdm
        asset-class: stock
        sector: semi
        symbols: [NVDAUSDT, AVGOUSDT, MRVLUSDT]
        streams:
          - stream: bookTicker
            route-prefix: "/public"
            topic: binance.raw.usdm.stock.bookticker
          - stream: aggTrade
            route-prefix: "/market"
            topic: binance.raw.usdm.stock.aggtrade
          - stream: depth@100ms
            route-prefix: "/public"
            topic: binance.raw.usdm.stock.depth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usdm-semi
  namespace: binance-ingestion
  labels:
    app.kubernetes.io/name: ingestion-collector
    app.kubernetes.io/instance: usdm-semi
    rate-group: variable
spec:
  replicas: 2   # Active-Active: 두 pod가 같은 스트림을 동시에 수신 (중복은 dedup에서 제거)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # 배포 중에도 2개가 계속 수신 → 수집 공백 없음
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: usdm-semi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-collector
        app.kubernetes.io/instance: usdm-semi
        rate-group: variable
        product: usdm
        asset-class: stock
        sector: semi
    spec:
      # 두 replica를 서로 다른 노드에 배치 → 노드 1대가 죽어도 하나는 수신을 이어감
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: usdm-semi
      terminationGracePeriodSeconds: 30   # @PreDestroy에서 WebSocket close 프레임을 보낼 시간
      securityContext:
        runAsNonRoot: true
      containers:
        - name: collector
          image: ingestion-collector:0.0.1
          imagePullPolicy: IfNotPresent   # kind load로 넣은 로컬 이미지를 사용
          envFrom:
            - configMapRef:
                name: ingestion-common
          env:
            - name: COLLECTOR_ID           # envelope의 collector_id (어느 pod가 보낸 메시지인지)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: application-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: application-config
          configMap:
            name: usdm-semi-config
---
# 노드 drain 등 자발적 중단 시에도 최소 1개는 남겨 둔다
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: usdm-semi
  namespace: binance-ingestion
  labels:
    app.kubernetes.io/name: ingestion-collector
    app.kubernetes.io/instance: usdm-semi
    rate-group: variable
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: usdm-semi
