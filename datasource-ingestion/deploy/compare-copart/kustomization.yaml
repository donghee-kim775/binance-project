# co-partitioning 실험: markPrice를 Flink key group 규칙으로 파티셔닝해 .copart 토픽에 쓰는 수집기를 하나 더 띄운다
#   docker build -f deploy/Dockerfile -t kimdonghee125/ingestion-collector:0.0.2 collector     (datasource-ingestion/ 에서)
#   docker push kimdonghee125/ingestion-collector:0.0.2
#   kubectl apply -k datasource-ingestion/deploy/compare-copart
#   kubectl delete -k datasource-ingestion/deploy/compare-copart     (끝나면)
# common.yaml(Namespace)은 넣지 않는다 → delete -k 해도 binance-ingestion namespace가 지워지지 않는다.
# 먼저 기본 수집(common.yaml, spot-sov.yaml)이 떠 있어야 한다 (ingestion-common ConfigMap을 쓴다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - markprice-usdm-sov-copart.yaml
  - markprice-copart-topic.yaml
