spring:
  application:
    name: ingestion-collector # app name
  main:
    web-application-type: none # servlet / reactive / none
  # 실행 환경 프로파일 — 아무것도 안 주면 local (bootRun, java -jar)
  #   local   : application-local.yml   → Kafka localhost:9092
  #   release : application-release.yml → Kafka K8s 내부 DNS (deploy/common.yaml이 SPRING_PROFILES_ACTIVE=release로 켬)
  profiles:
    default: local
  # Kafka producer — 접속 주소(bootstrap-servers)는 프로파일 yml에 있다 (docs/kafka/settings.md 3절)
  kafka:
    producer:
      # 
      key-serializer: org.apache.kafka.common.serialization.StringSerializer   # 키: 심볼
      value-serializer: org.apache.kafka.common.serialization.StringSerializer # 값: envelope JSON (BinanceRawEventPublisher가 직렬화)
      acks: all               # ISR 전부(min.insync.replicas 2 이상)에 써진 뒤 성공 처리
      compression-type: zstd  # 토픽 compression.type과 맞춰 브로커가 다시 압축하지 않게 한다
      # 
      properties:
        enable.idempotence: true # 재시도로 같은 메시지가 두 번 써지는 것을 막는다

binance:
  # endpoint: 환경(테스트넷/프로덕션)에 따라서만 달라지는 product별 접속 주소 → BinanceProperties.Endpoint
  # — 모든 Pod가 같은 값이라 여기에만 두고 ConfigMap에는 넣지 않는다. 도메인 변경 시 이 값만 바꾼다.
  # (docs/binance-api/binanceAPIREADME.md, binanceWebSocketREADME.md 참고)
  endpoint:
    spot:
      restapi-url: https://api.binance.com
      wss-url: wss://stream.binance.com:9443
    usdm-futures:
      restapi-url: https://fapi.binance.com
      wss-url: wss://fstream.binance.com

  # subscription: Pod(인스턴스)마다 달라지는 구독 설정 → BinanceProperties.Subscription
  # — 로컬 실행용 기본값(spot-sov pod와 동일). K8s에서는 ConfigMap(/config/application.yaml)이 덮어쓴다.
  # (datasource-ingestion/deploy/mapping.md 참고)
  subscription:
    group: variable-rate
    product: spot
    asset-class: crypto
    sector: sov
    symbols: [BTCUSDT]
    streams:
      - stream: bookTicker
        route-prefix: ""
        topic: binance.raw.spot.crypto.bookticker
      - stream: trade
        route-prefix: ""
        topic: binance.raw.spot.crypto.trade
      - stream: depth@100ms
        route-prefix: ""
        topic: binance.raw.spot.crypto.depth

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.ingestion: INFO
