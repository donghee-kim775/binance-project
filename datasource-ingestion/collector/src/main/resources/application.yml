spring:
  application:
    name: ingestion-collector # app name
  main:
    web-application-type: none # servlet / reactive / none

# setup: Pod(인스턴스)마다 달라지는 값. meta: 환경(테스트넷/프로덕션)에 따라서만 달라지는
# product별 접속 주소 — 도메인 변경 시 코드 수정 없이 이 값만 바꾼다.
# (binanceAPIREADME.md, binanceWebSocketREADME.md 참고)
binance:
  setup:
    symbol: BTCUSDT
  meta:
    spot:
      rest-base-url: https://api.binance.com
      websocket-stream-url: wss://stream.binance.com:9443
    usdm-futures:
      rest-base-url: https://fapi.binance.com
      websocket-stream-url: wss://fstream.binance.com

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.ingestion: INFO
