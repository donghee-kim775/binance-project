<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BTCUSDT Live POC</title>
<style>
  :root {
    color-scheme: light dark;
    --up: #1a9c53;
    --down: #d9432b;
    --muted: #8a8f98;
  }
  body {
    margin: 0;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1116;
    color: #e6e8eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #161a21;
    border: 1px solid #262b33;
    border-radius: 12px;
    padding: 24px;
    box-sizing: border-box;
  }
  .symbol {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .mid-price {
    font-size: 40px;
    font-weight: 700;
    margin: 8px 0 16px;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s ease;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-top: 1px solid #262b33;
    font-size: 14px;
  }
  .row .label { color: var(--muted); }
  .row .value { font-variant-numeric: tabular-nums; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.connected { background: var(--up); }
  .dot.disconnected { background: var(--down); }
  .updated-at {
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="symbol">BTCUSDT · Spot bookTicker</div>
    <div class="mid-price" id="midPrice">-</div>
    <div class="row"><span class="label">Best Bid</span><span class="value" id="bidPrice">-</span></div>
    <div class="row"><span class="label">Best Ask</span><span class="value" id="askPrice">-</span></div>
    <div class="row"><span class="label">Update ID</span><span class="value" id="updateId">-</span></div>
  </div>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">connecting...</span>
    <span class="updated-at" id="updatedAt"></span>
  </div>

<script>
  // POC 목적: 계산(basis 등) 없이 Binance Spot bookTicker를 그대로 화면에 push로 그려본다.
  // 백엔드 Gateway가 아직 없으므로, 이 POC 단계에서는 브라우저가 Binance WebSocket에 직접 붙는다.
  const STREAM_URL = "wss://stream.binance.com:9443/ws/btcusdt@bookTicker";
  const RECONNECT_DELAY_MS = 3000;

  const midPriceEl = document.getElementById("midPrice");
  const bidPriceEl = document.getElementById("bidPrice");
  const askPriceEl = document.getElementById("askPrice");
  const updateIdEl = document.getElementById("updateId");
  const statusDotEl = document.getElementById("statusDot");
  const statusTextEl = document.getElementById("statusText");
  const updatedAtEl = document.getElementById("updatedAt");

  let lastMid = null;

  function setStatus(state, text) {
    statusDotEl.className = "dot " + state;
    statusTextEl.textContent = text;
  }

  function connect() {
    setStatus("connecting", "connecting...");
    const ws = new WebSocket(STREAM_URL);

    ws.onopen = () => {
      setStatus("connected", "connected");
    };

    ws.onmessage = (event) => {
      const tick = JSON.parse(event.data);
      const bid = parseFloat(tick.b);
      const ask = parseFloat(tick.a);
      const mid = (bid + ask) / 2;

      midPriceEl.textContent = mid.toFixed(2);
      midPriceEl.style.color =
        lastMid === null ? "inherit" : mid > lastMid ? "var(--up)" : mid < lastMid ? "var(--down)" : "inherit";
      lastMid = mid;

      bidPriceEl.textContent = bid.toFixed(2);
      askPriceEl.textContent = ask.toFixed(2);
      updateIdEl.textContent = tick.u;
      updatedAtEl.textContent = "last update " + new Date().toLocaleTimeString();
    };

    ws.onerror = () => {
      setStatus("disconnected", "error — reconnecting");
    };

    ws.onclose = () => {
      setStatus("disconnected", "disconnected — reconnecting");
      setTimeout(connect, RECONNECT_DELAY_MS);
    };
  }

  connect();
</script>

</body>
</html>
