# 비교 실행용 임시 토픽 — Flink dedup과 Kafka Streams dedup을 나란히 띄울 때 Kafka Streams가 여기에 쓴다
# 토픽 이름 규칙(binance.<계층>.<product>.<자산종류>.<스트림>)을 벗어나므로 Infra/Kafka/Kafka-Topic에 두지 않는다.
# 비교가 끝나면 지운다: kubectl delete -k consumer/kstreams-dedup/compare
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: binance.clean.spot.crypto.bookticker.kstreams
  namespace: binancekafka
  labels:
    strimzi.io/cluster: binance-cluster
spec:
  partitions: 3     # clean과 같게
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 86400000
    cleanup.policy: delete
    compression.type: zstd
