# Flink dedup 테스트용 토픽 (Insight 1의 job 1 입력 · 출력)
# 설정은 docs/kafka/topics.md 기준: 파티션 3, 보존 24h
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: binance.raw.spot.crypto.bookticker
  namespace: kafka
  labels:
    strimzi.io/cluster: binance-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 86400000
    cleanup.policy: delete
    compression.type: zstd
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: binance.clean.spot.crypto.bookticker
  namespace: kafka
  labels:
    strimzi.io/cluster: binance-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 86400000
    cleanup.policy: delete
    compression.type: zstd
