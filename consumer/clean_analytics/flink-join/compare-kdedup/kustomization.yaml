# 경우의 수 비교: Kafka Streams dedup 결과(clean .kstreams)를 Flink basis가 읽는 경로 (K→F)
#   raw → kstreams-dedup → binance.clean.spot.crypto.bookticker.kstreams → flink-basis-kdedup → binance.analytics.crypto.basis.kdedup.flink
#   kubectl apply -k consumer/clean_analytics/flink-join/compare-kdedup
#   kubectl delete -k consumer/clean_analytics/flink-join/compare-kdedup     (끝나면)
# 먼저 kstreams-dedup을 compare 모드로 띄운다 (consumer/raw_clean/kstreams-dedup/compare). 대시보드: Infra/Monitoring/dashboards/binance-processing-jobs/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../deploy
  - basis-kdedup-flink-topic.yaml

patches:
  - target:
      kind: FlinkDeployment
      name: flink-basis
    patch: |-
      - op: replace
        path: /metadata/name
        value: flink-basis-kdedup
      # MinIO 경로도 job 이름으로 나눈다 (CLAUDE.md MinIO 경로 규칙)
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.dir
        value: s3://binance/flink/analytics/flink-basis-kdedup/checkpoints
      - op: replace
        path: /spec/flinkConfiguration/execution.checkpointing.savepoint-dir
        value: s3://binance/flink/analytics/flink-basis-kdedup/savepoints
      - op: replace
        path: /spec/flinkConfiguration/high-availability.storageDir
        value: s3://binance/flink/analytics/flink-basis-kdedup/ha
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: KAFKA_GROUP_ID
          value: flink-basis-kdedup
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: SPOT_TOPIC_SUFFIX
          value: .kstreams
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: BASIS_TOPIC_SUFFIX
          value: .kdedup.flink
