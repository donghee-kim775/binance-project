# Kafka Streams basis — clean Spot bookTicker + raw USD-M markPrice → analytics basis (consumer/clean_analytics/kstreams-join/README.md)
# Flink basis(consumer/clean_analytics/flink-join, FlinkDeployment flink-basis)와 같은 일을 한다. **둘을 같은 출력 토픽에 쓰게 띄우지 않는다.**
# 나란히 비교할 때는 compare/ overlay로 띄운다 (출력 토픽에 .kstreams 접미어).
#   docker build -t kimdonghee125/kstreams-join:0.0.3 .          (consumer/clean_analytics/kstreams-join/ 에서)
#   docker push kimdonghee125/kstreams-join:0.0.3
#   kubectl apply -k compare      (비교 실행)   /   kubectl apply -f deploy/basis.yaml   (단독 실행)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kstreams-basis
  namespace: binance-processing
  labels:
    app.kubernetes.io/name: kstreams-basis
spec:
  # task(= 파티션 3개. spot · mark가 한 task로 묶인다)를 pod 2개가 나눠 가진다. 한 pod가 죽으면 남은 pod가
  # 리밸런스로 그 task를 받고 changelog 토픽에서 latest-spot을 복원해 이어 처리한다
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kstreams-basis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kstreams-basis
    spec:
      terminationGracePeriodSeconds: 30   # shutdown hook의 streams.close(20s)가 트랜잭션을 마무리할 시간
      securityContext:
        runAsNonRoot: true
      containers:
        - name: basis
          image: kimdonghee125/kstreams-join:0.0.3
          imagePullPolicy: IfNotPresent   # Docker Hub(kimdonghee125)에서 받는다. 태그를 올려서 배포한다
          env:
            # = consumer group 이름 · changelog 토픽 앞부분. 바꾸면 offset과 state를 처음부터 다시 쌓는다
            - name: KAFKA_APPLICATION_ID
              value: kstreams-basis
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: binance-cluster-kafka-bootstrap.binancekafka.svc:9092
            - name: NUM_STREAM_THREADS # pod당 스레드. (task 3개)
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 512Mi   # heap = 60% (MaxRAMPercentage). state는 심볼마다 Spot 한 건이라 작다
