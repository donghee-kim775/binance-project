# slf4j-simple 설정. Kafka 클라이언트의 INFO 로그(설정 덤프, 메타데이터 갱신)가 많아 WARN으로 줄인다
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSZ
org.slf4j.simpleLogger.log.org.apache.kafka=warn
# 상태 전이(REBALANCING → RUNNING)와 task 할당은 보고 싶다
org.slf4j.simpleLogger.log.org.apache.kafka.streams.KafkaStreams=info
org.slf4j.simpleLogger.log.org.apache.kafka.streams.processor.internals.StreamThread=info
