# Kafka Streams dedup — raw → clean (consumer/raw_clean/kstreams-dedup/README.md)
# Flink dedup(consumer/raw_clean/flink-dedup, FlinkDeployment flink-dedup)을 대체한다. **둘을 같이 띄우지 않는다** (clean에 중복이 생긴다).
#   docker build -t kimdonghee125/kstreams-dedup:0.0.1 .          (consumer/raw_clean/kstreams-dedup/ 에서)
#   docker push kimdonghee125/kstreams-dedup:0.0.1
#   kubectl apply -f deploy/dedup.yaml
# Flink에서 넘어올 때는 README의 "전환 절차"를 먼저 따른다 (offset을 넘겨받지 않으면 raw 24h를 처음부터 다시 쓴다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kstreams-dedup
  namespace: binance-processing
  labels:
    app.kubernetes.io/name: kstreams-dedup
spec:
  # task(경로 수 × 파티션 3)를 pod 2개가 나눠 가진다. 한 pod가 죽으면 남은 pod가 리밸런스로 그 task를 받고
  # changelog 토픽에서 store를 복원해 이어 처리한다. EOS라 두 pod가 잠깐 겹쳐도(롤링 업데이트) 중복이 생기지 않는다
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kstreams-dedup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kstreams-dedup
    spec:
      terminationGracePeriodSeconds: 30   # shutdown hook의 streams.close(20s)가 트랜잭션을 마무리할 시간
      securityContext:
        runAsNonRoot: true
      containers:
        - name: dedup
          image: kimdonghee125/kstreams-dedup:0.0.1
          imagePullPolicy: IfNotPresent   # Docker Hub(kimdonghee125)에서 받는다. 태그를 올려서 배포한다
          # 경로 = <product>.<자산종류>.<스트림>:<id 필드> → binance.<raw|clean>.<경로> (Flink 버전 job.args와 같다)
          # 추가할 때는 raw · clean 토픽도 같이 만든다. markprice는 Active-Standby라 중복이 없어 제외
          args:
            - spot.crypto.bookticker:u
            # - spot.crypto.trade:t
            # - spot.crypto.depth:u
            # - usdm.crypto.bookticker:u
            # - usdm.crypto.aggtrade:a
            # - usdm.crypto.depth:u
            # - usdm.stock.bookticker:u
            # - usdm.stock.aggtrade:a
            # - usdm.stock.depth:u
          env:
            # = consumer group 이름 · changelog 토픽 앞부분. 바꾸면 offset과 state를 처음부터 다시 쌓는다
            #   (deploy/auto-scaling/scaledobject.yaml의 consumerGroup도 같이 바꾼다)
            - name: KAFKA_APPLICATION_ID
              value: kstreams-dedup
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: binance-cluster-kafka-bootstrap.binancekafka.svc:9092
            # pod당 스레드. task = route 1개 × 파티션 3 = 3개
            #  - 1이면 pod 2개 중 하나가 task 2개(파티션 0 · 2)를 스레드 하나로 처리해, 파티션 2(초당 ~1,700건)를 못 따라간다 (2026-11-28 lag 9만)
            #  - 2면 스레드 4개 > task 3개라 task마다 스레드 하나씩 돈다
            - name: NUM_STREAM_THREADS
              value: "2"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 512Mi   # heap = 60% (MaxRAMPercentage). state는 1분치 키라 heap 안에 들어간다
